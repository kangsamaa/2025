<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Spring Boot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .python-result {
            background-color : #f8f9fa;
            padding: 20px;
            border-left: 2px solid #ccc;
            height: 100%;
            overflow-y: auto;
            position: fixed;
            right: 0;
            top: 50px;
            width: 30%;
            z-index: 100;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-between"> <!-- 양 끝에 배치 -->
            <!-- 왼쪽: 기존 콘텐츠 -->
            <div class="col-md-8">
                <h1 class="text-center">Welcome to the Spring Boot Application!</h1>
                <p class="text-center">This is the index page.</p>
                <div class="text-center">
                    <a href="/users" class="btn btn-primary">Go to User List</a>
                </div>
                <div class="text-center mt-3">
                    <a href="/user/create" class="btn btn-success">Go to User Registration</a>
                </div>
            </div>

            <!-- 오른쪽: Python 실행 결과 -->
            <div class="python-result">
                <h2 class="text-center">Python Execution Result</h2>
                <input type="text" id="nameInput" class="form-control mb-2" placeholder="Enter name (default: TestWorld)">
                <button id="runPythonBtn" class="btn btn-primary w-100">Run Python Script</button>
                <pre id="pythonOutput">Click the button to execute Python script...!!!!!</pre>
            </div>
        </div>
    </div>

    <script>
        // Python 실행 버튼 클릭 이벤트
        $("#runPythonBtn").click(function () {
            let name = $("#nameInput").val();
            if (!name) {
                name = "TestWorld"; // 기본값
            }
            $.get("/api/python/run", { name: name }, function (data) {
                $("#pythonOutput").html(data);
            });
        });
    </script>

</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
