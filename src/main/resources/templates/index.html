<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Spring Boot</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* 전체 페이지 스타일 */
        html, body {
            height: 100%;
            margin: 0;
        }

        .container {
            margin-top: 50px;
        }

        .content-box {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #ccc;
            background-color: #f8f9fa;
        }

        .hidden {
            display: none;
        }

        .alert-danger {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <div th:replace="~{fragments/header}"></div>

    <!-- 메인 콘텐츠 -->
    <div class="container">
        <div class="row">
            <!-- 로그인 / 회원가입 영역 -->
            <div class="col-md-6">
                <div class="content-box" id="auth-container">
                    <!-- 로그인 폼 -->
                    <div id="login-form">
                        <h2>ログイン</h2>
                        <input type="text" class="form-control mb-2" id="login-username" placeholder="ユーザー名">
                        <input type="password" class="form-control mb-2" id="login-password" placeholder="パスワード">
                        <button class="btn btn-primary" id="login-btn">ログイン</button>
                        <!-- 로그인 실패 시 표시할 메시지 -->
                        <p id="login-error" class="text-danger mt-3 hidden">
                            ログインに失敗しました。ユーザー名またはパスワードが正しくありません。
                        </p>
                    </div>
                </div>

                <!-- 로그인 성공 시 표시 -->
                <div class="content-box hidden" id="welcome-container">
                    <h2 id="welcome-message"></h2>
                    <button class="btn btn-danger" id="logout-btn">ログアウト</button>
                </div>
            </div>

            <!-- 날씨 정보 -->
            <div class="col-md-6">
                <div class="content-box">
                    <div id="weather-container">
                        <p>データ読み込み中</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery AJAX -->
    <script>
        $(document).ready(function() {
            // 로그인 상태 확인
            checkSession();
        
            // 로그인 버튼 클릭
            $("#login-btn").click(function() {
                let username = $("#login-username").val();
                let password = $("#login-password").val();
        
                $.post("/auth/login", { username: username, password: password }, function(response) {
                    if (response.status === "success") {
                        showWelcome(username);
                    } else {
                        // 로그인 실패 시 오류 메시지 표시
                        $("#login-error").removeClass("hidden");
                        $("#login-error").text(response.message);
                    }
                }).fail(function() {
                    // 로그인 실패 시 기본 오류 메시지 표시
                    $("#login-error").removeClass("hidden");
                    $("#login-error").text("サーバーエラーが発生しました。再度お試しください。");
                });
            });
        
            // 로그아웃 버튼 클릭
            $("#logout-btn").click(function() {
                $.post("/auth/logout", function() {
                    $("#welcome-container").hide();
                    $("#auth-container").show();
                    $("#login-username, #login-password").val("");
                });
            });
        
            // 세션 확인 함수
            function checkSession() {
                $.get("/auth/session", function(data) {
                    if (data.loggedIn) {
                        showWelcome(data.username);
                    }
                });
            }
        
            // 로그인 성공 시 UI 변경
            function showWelcome(username) {
                $("#auth-container").hide();
                $("#welcome-container").show();
                $("#welcome-message").text(username + " さん、ようこそ！");
            }
        
            // 날씨 정보 가져오기
            $.get("/weather", function(data) {
                $("#weather-container").html(data);
            }).fail(function() {
                $("#weather-container").html("<p>Failed to load weather data.</p>");
            });
        });
    </script>

</body>
</html>
