<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Spring Boot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* 전체 페이지에 대한 스타일 설정 */
        html, body {
            height: 100%;
            margin: 0;
        }

        /* 콘텐츠를 중앙에 배치 */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 150px;
        }

        .content-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 900px;
            width: 100%;
            margin-bottom: 50px;
        }

        .content-right {
            background-color: #f8f9fa;
            padding: 20px;
            border: 2px solid #ccc;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴를 이곳에 포함 -->
    <div th:replace="~{fragments/header}"></div>

    <!-- 메인 콘텐츠 -->
    <div class="container">
        <div class="content-left">
            <h1>Welcome to the Spring Boot Application!</h1>
            <p>This is the index page.</p>
        </div>

        <div class="content-right">
            <h2 class="text-center">Python Execution Result</h2>
            <input type="text" id="nameInput" class="form-control mb-2" placeholder="Enter name (default: TestWorld)">
            <button id="runPythonBtn" class="btn btn-primary w-100">Run Python Script</button>
            <pre id="pythonOutput">Click the button to execute Python script...!!!!!</pre>
        </div>
    </div>

    <script>
        // Python 실행 버튼 클릭 이벤트
        $("#runPythonBtn").click(function () {
            let name = $("#nameInput").val();
            $.get("/api/python/run", { name: name }, function (data) {
                $("#pythonOutput").html(data);
            });
        });
    </script>

</body>
</html>
